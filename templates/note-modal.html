  <!-- Note Editor Modal -->
  <div id="note-modal" class="modal-overlay">
    <div class="modal-card" id="modal-card-element">
      <div class="modal-header">
        <md-icon-button id="btn-modal-back" icon="arrow_back" class="modal-back-btn" aria-label="Go back"></md-icon-button>
        <input type="text" id="modal-title" data-i18n-placeholder="modal_title_placeholder" placeholder="Title">
        <md-icon-button id="btn-modal-pin" icon="keep" aria-label="Pin note"></md-icon-button>
      </div>

      <input type="file" id="modal-image-input" accept="image/*" multiple class="hidden">
      <div id="modal-images-preview" class="note-images-preview hidden"></div>

      <div class="modal-body">
        <div id="modal-checklist-view" class="modal-checklist hidden"></div>
        <div id="modal-body-text" class="note-editor-body" contenteditable="true" role="textbox" aria-multiline="true"
          data-i18n-placeholder="modal_body_placeholder" data-placeholder="Note"></div>

        <md-chip-set id="modal-tags-list" class="note-tags-container"></md-chip-set>
        <div class="tag-input-wrapper">
          <input type="text" id="modal-tag-input" data-i18n-placeholder="modal_tag_input_placeholder"
            placeholder="Add tag + press Enter...">
        </div>
      </div>

      <div class="modal-footer">
        <md-toolbar id="modal-toolbar" class="modal-toolbar" aria-label="Note actions">
          <!-- Modal Color Picker -->
          <div class="color-picker-wrapper">
            <md-icon-button id="btn-modal-color" icon="palette" aria-label="Change color"></md-icon-button>
            <div class="color-palette-popup" role="radiogroup" aria-label="Color options">
              <button type="button" id="btn-modal-color-default" class="color-option default" data-color="default" role="radio" aria-checked="false" data-i18n-aria="color_default" aria-label="Default">
                <md-icon name="format_color_reset" size="18"></md-icon>
                <md-icon name="check" size="18" class="color-check-icon"></md-icon>
              </button>

              <button type="button" id="btn-modal-color-red" class="color-option red" data-color="red" role="radio" aria-checked="false" data-i18n-aria="color_red" aria-label="Red">
                <md-icon name="check" size="18" class="color-check-icon"></md-icon>
              </button>

              <button type="button" id="btn-modal-color-orange" class="color-option orange" data-color="orange" role="radio" aria-checked="false" data-i18n-aria="color_orange" aria-label="Orange">
                <md-icon name="check" size="18" class="color-check-icon"></md-icon>
              </button>

              <button type="button" id="btn-modal-color-yellow" class="color-option yellow" data-color="yellow" role="radio" aria-checked="false" data-i18n-aria="color_yellow" aria-label="Yellow">
                <md-icon name="check" size="18" class="color-check-icon"></md-icon>
              </button>

              <button type="button" id="btn-modal-color-green" class="color-option green" data-color="green" role="radio" aria-checked="false" data-i18n-aria="color_green" aria-label="Green">
                <md-icon name="check" size="18" class="color-check-icon"></md-icon>
              </button>

              <button type="button" id="btn-modal-color-teal" class="color-option teal" data-color="teal" role="radio" aria-checked="false" data-i18n-aria="color_teal" aria-label="Teal">
                <md-icon name="check" size="18" class="color-check-icon"></md-icon>
              </button>

              <button type="button" id="btn-modal-color-blue" class="color-option blue" data-color="blue" role="radio" aria-checked="false" data-i18n-aria="color_blue" aria-label="Blue">
                <md-icon name="check" size="18" class="color-check-icon"></md-icon>
              </button>

              <button type="button" id="btn-modal-color-purple" class="color-option purple" data-color="purple" role="radio" aria-checked="false" data-i18n-aria="color_purple" aria-label="Purple">
                <md-icon name="check" size="18" class="color-check-icon"></md-icon>
              </button>

              <button type="button" id="btn-modal-color-pink" class="color-option pink" data-color="pink" role="radio" aria-checked="false" data-i18n-aria="color_pink" aria-label="Pink">
                <md-icon name="check" size="18" class="color-check-icon"></md-icon>
              </button>
            </div>
          </div>
          <md-icon-button id="btn-modal-checklist-toggle" icon="checklist" class="hidden"
            aria-label="Toggle checklist view"></md-icon-button>
          <md-icon-button id="btn-modal-image" icon="image"
            aria-label="Add image"></md-icon-button>
          <md-icon-button id="btn-modal-copy" icon="content_copy"
            aria-label="Make a copy"></md-icon-button>
          <md-icon-button id="btn-modal-archive" icon="archive"
            aria-label="Archive"></md-icon-button>
          <md-icon-button id="btn-modal-trash" icon="delete"
            aria-label="Delete"></md-icon-button>
          <md-icon-button id="btn-modal-delete-forever" icon="delete" class="hidden"
            aria-label="Delete forever"></md-icon-button>
        </md-toolbar>
        <span class="last-edited-label" id="modal-last-edited" data-i18n="modal_last_edited">Edited 2 mins ago</span>
        <md-button id="btn-modal-close" variant="filled"><span data-i18n="btn_modal_close">Close</span></md-button>
      </div>
    </div>

    <!-- Modal Tooltips positioned outside transformed modal-card -->
    <md-tooltip for="btn-modal-back" show-delay="200">Save and close</md-tooltip>
    <md-tooltip id="tooltip-modal-pin" for="btn-modal-pin" show-delay="200" data-i18n="btn_pin_note_title">Pin note</md-tooltip>
    <md-tooltip for="btn-modal-color" show-delay="200" data-i18n="btn_creator_color_title">Change color</md-tooltip>
    <md-tooltip for="btn-modal-color-default" show-delay="200" data-i18n="color_default">Default</md-tooltip>
    <md-tooltip for="btn-modal-color-red" show-delay="200" data-i18n="color_red">Red</md-tooltip>
    <md-tooltip for="btn-modal-color-orange" show-delay="200" data-i18n="color_orange">Orange</md-tooltip>
    <md-tooltip for="btn-modal-color-yellow" show-delay="200" data-i18n="color_yellow">Yellow</md-tooltip>
    <md-tooltip for="btn-modal-color-green" show-delay="200" data-i18n="color_green">Green</md-tooltip>
    <md-tooltip for="btn-modal-color-teal" show-delay="200" data-i18n="color_teal">Teal</md-tooltip>
    <md-tooltip for="btn-modal-color-blue" show-delay="200" data-i18n="color_blue">Blue</md-tooltip>
    <md-tooltip for="btn-modal-color-purple" show-delay="200" data-i18n="color_purple">Purple</md-tooltip>
    <md-tooltip for="btn-modal-color-pink" show-delay="200" data-i18n="color_pink">Pink</md-tooltip>
    <md-tooltip for="btn-modal-checklist-toggle" show-delay="200" data-i18n="btn_modal_checklist_toggle_title">Toggle checklist view</md-tooltip>
    <md-tooltip for="btn-modal-image" show-delay="200" data-i18n="btn_modal_image_title">Add image</md-tooltip>
    <md-tooltip for="btn-modal-copy" show-delay="200" data-i18n="btn_modal_copy_title">Make a copy</md-tooltip>
    <md-tooltip id="tooltip-modal-archive" for="btn-modal-archive" show-delay="200" data-i18n="btn_modal_archive_title">Archive</md-tooltip>
    <md-tooltip id="tooltip-modal-trash" for="btn-modal-trash" show-delay="200" data-i18n="btn_modal_trash_delete_title">Delete note</md-tooltip>
    <md-tooltip for="btn-modal-delete-forever" show-delay="200" data-i18n="btn_modal_trash_delete_forever_title">Delete forever</md-tooltip>
  </div>

  <!-- Permanently Delete Note Confirmation Dialog -->
  <md-dialog id="delete-confirm-dialog" headline="Delete note?" icon="delete" data-i18n-headline="dialog_delete_note_title">
    <span data-i18n="confirm_delete_note">Permanently delete this note? This cannot be undone.</span>
    <div slot="actions">
      <md-button id="btn-delete-confirm-cancel" variant="text">
        <span data-i18n="btn_cancel">Cancel</span>
      </md-button>
      <md-button id="btn-delete-confirm-accept" variant="filled">
        <span data-i18n="btn_modal_trash_delete_forever_title">Delete forever</span>
      </md-button>
    </div>
  </md-dialog>
