  <!-- Dedicated Sign-in Modal -->
  <md-dialog id="login-modal" class="login-modal-dialog">
    <div class="modal-card" style="max-width: 440px; height: auto; min-height: unset; max-height: 90vh;">
      <div class="settings-header">
        <h2 style="display: flex; align-items: center; gap: 8px;">
          <span>Sign in</span>
        </h2>
        <md-icon-button id="btn-login-close" icon="close" aria-label="Close modal"></md-icon-button>
      </div>
      <div class="settings-body" style="padding-top: 8px; gap: 16px; width: 100%;">
        <p class="section-help" data-i18n="settings_sync_help" style="margin-bottom: 8px;">
          Configure synchronization with your personal Filen account. All notes synced will be fully encrypted
          client-side; not us nor Filen will see your password or plaintext notes.
        </p>

        <div id="sync-credentials-container" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
          <md-text-field
            id="sync-email"
            variant="outlined"
            label="Email Address"
            type="email"
            leading-icon="mail"
            style="width: 100%;"
          ></md-text-field>

          <md-text-field
            id="sync-password"
            variant="outlined"
            label="Password"
            type="password"
            leading-icon="lock"
            style="width: 100%;"
          ></md-text-field>

          <md-text-field
            id="sync-twofactor"
            variant="outlined"
            label="Two-Factor Auth Code (Optional)"
            type="text"
            leading-icon="security"
            style="width: 100%;"
          ></md-text-field>
        </div>

        <span id="sync-settings-status" class="status-message"
          style="display: block; min-height: 20px; text-align: center; margin-top: 8px; width: 100%;"></span>

        <div class="settings-actions"
          style="display: flex; flex-direction: row; justify-content: center; gap: 8px; margin-top: 12px; width: 100%;">
          <md-button id="btn-login-cancel" variant="text">
            <span data-i18n="btn_cancel">Cancel</span>
          </md-button>
          <md-button id="btn-save-sync" variant="filled">
            <span data-i18n="btn_login">Sign in</span>
          </md-button>
        </div>
      </div>
    </div>
  </md-dialog>
