  <!-- Dedicated Sign-in Modal -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-card login-modal-card">
      <div class="modal-header login-modal-header">
        <div class="login-modal-title-wrapper">
          <md-icon-button id="btn-login-back" icon="arrow_back" class="modal-back-btn" aria-label="Go back" title="Go back"></md-icon-button>
          <h2>
            <span data-i18n="btn_login">Sign in</span>
          </h2>
        </div>
        <md-icon-button id="btn-login-close" icon="close" aria-label="Close modal" title="Close"></md-icon-button>
      </div>
      <div class="modal-body login-modal-body">
        <p class="section-help" data-i18n="settings_sync_help">
          Configure synchronization with your personal Filen account. All notes synced will be fully encrypted
          client-side; not us nor Filen will see your password or plaintext notes.
        </p>

        <div id="sync-credentials-container" class="login-credentials-container">
          <md-text-field
            id="sync-email"
            variant="outlined"
            label="Email Address"
            type="email"
            leading-icon="mail"
          ></md-text-field>

          <md-text-field
            id="sync-password"
            variant="outlined"
            label="Password"
            type="password"
            leading-icon="lock"
          ></md-text-field>

          <md-text-field
            id="sync-twofactor"
            variant="outlined"
            label="Two-Factor Auth Code (Optional)"
            type="text"
            leading-icon="security"
          ></md-text-field>
        </div>

        <span id="sync-settings-status" class="status-message"></span>

        <div class="login-modal-actions">
          <md-button id="btn-login-cancel" variant="text">
            <span data-i18n="btn_cancel">Cancel</span>
          </md-button>
          <md-button id="btn-save-sync" variant="filled">
            <span data-i18n="btn_login">Sign in</span>
          </md-button>
        </div>
      </div>
    </div>
  </div>
