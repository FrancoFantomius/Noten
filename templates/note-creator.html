        <!-- Note Creator Component -->
        <div id="note-creator" class="note-creator-container color-default">
          <!-- Minimized state -->
          <div id="creator-collapsed" class="creator-collapsed">
            <span id="creator-prompt-text" class="creator-prompt-text" data-i18n="creator_collapsed_prompt">Write your notes</span>
            <div class="creator-actions-collapsed">
              <md-icon-button id="btn-quick-todo" icon="check_box" aria-label="New checklist"></md-icon-button>
              <md-icon-button id="btn-quick-image" icon="image" aria-label="Add image"></md-icon-button>
            </div>
          </div>

          <!-- Expanded state -->
          <div id="creator-expanded" class="creator-expanded hidden">
            <div class="creator-title-row">
              <input type="text" id="creator-title" data-i18n-placeholder="creator_title_placeholder"
                placeholder="Title" autocomplete="off">
              <md-icon-button id="btn-creator-pin" icon="keep" aria-label="Pin note"></md-icon-button>
            </div>

            <input type="file" id="creator-image-input" accept="image/*" multiple class="hidden">
            <div id="creator-images-preview" class="note-images-preview hidden"></div>

            <div id="creator-checklist-view" class="modal-checklist hidden"></div>
            <div id="creator-body" class="note-editor-body" contenteditable="true" role="textbox" aria-multiline="true"
              data-i18n-placeholder="creator_body_placeholder" data-placeholder="Write your notes"></div>

            <!-- Dynamic tags input / list in note creator -->
            <md-chip-set id="creator-tags-list" class="note-tags-container"></md-chip-set>
            <div class="tag-input-wrapper">
              <input type="text" id="creator-tag-input" data-i18n-placeholder="creator_tag_input_placeholder"
                placeholder="Add tag + press Enter...">
            </div>

            <!-- Toolbar and Actions -->
            <div class="creator-footer">
              <md-toolbar id="creator-toolbar" class="creator-toolbar" aria-label="Note creator actions">
                <!-- Color Selector Button -->
                <div class="color-picker-wrapper">
                  <md-icon-button id="btn-creator-color" icon="palette" aria-label="Change color"></md-icon-button>
                  <div class="color-palette-popup" role="radiogroup" aria-label="Color options">
                    <button type="button" id="btn-creator-color-default" class="color-option default active" data-color="default" role="radio" aria-checked="true" data-i18n-aria="color_default" aria-label="Default">
                      <md-icon name="format_color_reset" size="18"></md-icon>
                      <md-icon name="check" size="18" class="color-check-icon"></md-icon>
                    </button>

                    <button type="button" id="btn-creator-color-red" class="color-option red" data-color="red" role="radio" aria-checked="false" data-i18n-aria="color_red" aria-label="Red">
                      <md-icon name="check" size="18" class="color-check-icon"></md-icon>
                    </button>

                    <button type="button" id="btn-creator-color-orange" class="color-option orange" data-color="orange" role="radio" aria-checked="false" data-i18n-aria="color_orange" aria-label="Orange">
                      <md-icon name="check" size="18" class="color-check-icon"></md-icon>
                    </button>

                    <button type="button" id="btn-creator-color-yellow" class="color-option yellow" data-color="yellow" role="radio" aria-checked="false" data-i18n-aria="color_yellow" aria-label="Yellow">
                      <md-icon name="check" size="18" class="color-check-icon"></md-icon>
                    </button>

                    <button type="button" id="btn-creator-color-green" class="color-option green" data-color="green" role="radio" aria-checked="false" data-i18n-aria="color_green" aria-label="Green">
                      <md-icon name="check" size="18" class="color-check-icon"></md-icon>
                    </button>

                    <button type="button" id="btn-creator-color-teal" class="color-option teal" data-color="teal" role="radio" aria-checked="false" data-i18n-aria="color_teal" aria-label="Teal">
                      <md-icon name="check" size="18" class="color-check-icon"></md-icon>
                    </button>

                    <button type="button" id="btn-creator-color-blue" class="color-option blue" data-color="blue" role="radio" aria-checked="false" data-i18n-aria="color_blue" aria-label="Blue">
                      <md-icon name="check" size="18" class="color-check-icon"></md-icon>
                    </button>

                    <button type="button" id="btn-creator-color-purple" class="color-option purple" data-color="purple" role="radio" aria-checked="false" data-i18n-aria="color_purple" aria-label="Purple">
                      <md-icon name="check" size="18" class="color-check-icon"></md-icon>
                    </button>

                    <button type="button" id="btn-creator-color-pink" class="color-option pink" data-color="pink" role="radio" aria-checked="false" data-i18n-aria="color_pink" aria-label="Pink">
                      <md-icon name="check" size="18" class="color-check-icon"></md-icon>
                    </button>
                  </div>
                </div>
                <md-icon-button id="btn-creator-checklist-toggle" icon="checklist"
                  aria-label="Toggle checklist view"></md-icon-button>
                <md-icon-button id="btn-creator-image" icon="image"
                  aria-label="Add image"></md-icon-button>
                <!-- Archive/Trash helper inside creator -->
                <md-icon-button id="btn-creator-archive" icon="archive"
                  aria-label="Archive note"></md-icon-button>
                <md-icon-button id="btn-creator-trash" icon="delete"
                  aria-label="Discard note"></md-icon-button>
              </md-toolbar>

              <md-button id="btn-creator-close" variant="text"><span data-i18n="btn_creator_close">Close</span></md-button>
            </div>
          </div>

          <!-- Note Creator Tooltips positioned outside toolbar and swatches -->
          <md-tooltip for="btn-quick-todo" show-delay="200" data-i18n="btn_quick_todo_title">New checklist</md-tooltip>
          <md-tooltip for="btn-quick-image" show-delay="200" data-i18n="btn_creator_image_title">Add image</md-tooltip>
          <md-tooltip id="tooltip-creator-pin" for="btn-creator-pin" show-delay="200" data-i18n="btn_pin_note_title">Pin note</md-tooltip>
          <md-tooltip for="btn-creator-color" show-delay="200" data-i18n="btn_creator_color_title">Change color</md-tooltip>
          <md-tooltip for="btn-creator-color-default" show-delay="200" data-i18n="color_default">Default</md-tooltip>
          <md-tooltip for="btn-creator-color-red" show-delay="200" data-i18n="color_red">Red</md-tooltip>
          <md-tooltip for="btn-creator-color-orange" show-delay="200" data-i18n="color_orange">Orange</md-tooltip>
          <md-tooltip for="btn-creator-color-yellow" show-delay="200" data-i18n="color_yellow">Yellow</md-tooltip>
          <md-tooltip for="btn-creator-color-green" show-delay="200" data-i18n="color_green">Green</md-tooltip>
          <md-tooltip for="btn-creator-color-teal" show-delay="200" data-i18n="color_teal">Teal</md-tooltip>
          <md-tooltip for="btn-creator-color-blue" show-delay="200" data-i18n="color_blue">Blue</md-tooltip>
          <md-tooltip for="btn-creator-color-purple" show-delay="200" data-i18n="color_purple">Purple</md-tooltip>
          <md-tooltip for="btn-creator-color-pink" show-delay="200" data-i18n="color_pink">Pink</md-tooltip>
          <md-tooltip for="btn-creator-checklist-toggle" show-delay="200" data-i18n="btn_modal_checklist_toggle_title">Toggle checklist view</md-tooltip>
          <md-tooltip for="btn-creator-image" show-delay="200" data-i18n="btn_creator_image_title">Add image</md-tooltip>
          <md-tooltip for="btn-creator-archive" show-delay="200" data-i18n="btn_creator_archive_title">Archive note</md-tooltip>
          <md-tooltip for="btn-creator-trash" show-delay="200" data-i18n="btn_creator_trash_title">Discard note</md-tooltip>
        </div>
