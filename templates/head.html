<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Noten</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Your notes private and secure accross devices">
  <meta name="keywords"
    content="notes, private notes, secure notes, local-first, end-to-end encrypted notes, encrypted notes, pouchdb, filen sync">
  <meta name="author" content="Noten">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Noten">
  <meta property="og:description" content="Your notes private and secure accross devices">
  <meta property="og:image" content="./img/icons/noten_x512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Noten Logo">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Noten">
  <meta property="twitter:description" content="Your notes private and secure accross devices">
  <meta property="twitter:image" content="./img/icons/noten_x512.png">

  <!-- Favicon and App Manifest -->
  <link rel="icon" href="./img/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./img/icons/noten_x192.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161b22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">


  <!-- Sidebar Preload State -->
  <script>
    try {
      if (localStorage.getItem('sidebar_collapsed') === 'true' && window.innerWidth > 768) {
        document.documentElement.classList.add('sidebar-collapsed-preload');
      }
    } catch (e) {}
  </script>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
