<!DOCTYPE html>
<html lang="en">

{{> head}}

<body class="dark-theme {{bodyClass}}">

  <!-- Main Application Wrapper -->
  <div id="app-container" class="app-layout">

    {{> header}}

    <!-- Main Content Panel (Sidebar + Notes Grid) -->
    <div class="main-body">

      <!-- Sidebar overlay backdrop for mobile -->
      <div id="sidebar-overlay" class="sidebar-overlay"></div>

      {{> sidebar}}

      <!-- Notes Feed Area -->
      <main class="content-panel">

        {{> note-creator}}

        {{> notes-grid}}

      </main>
    </div>

    {{> navigation-bar}}
  </div>

  {{> note-modal}}

  {{> settings-modal}}

  {{> login-modal}}

  {{> lightbox}}

  {{> fab}}

  <!-- JavaScript Modules -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
